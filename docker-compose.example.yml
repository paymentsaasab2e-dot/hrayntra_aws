# Copy to docker-compose.yml on your AWS server (not tracked by git).
#   cp docker-compose.example.yml docker-compose.yml

services:
  backendphase2:
    build:
      context: ./backendphase2
      dockerfile: Dockerfile
    container_name: hrayntra-backendphase2
    restart: unless-stopped
    env_file:
      - ./backendphase2/.env
    ports:
      - "5001:5001"
    volumes:
      - backendphase2_uploads:/app/uploads

  backend1:
    build:
      context: ./backend1
      dockerfile: Dockerfile
    container_name: hrayntra-backend1
    restart: unless-stopped
    env_file:
      - ./backend1/.env
    ports:
      - "5000:5000"
    volumes:
      - backend1_uploads:/app/uploads

volumes:
  backendphase2_uploads:
  backend1_uploads:
